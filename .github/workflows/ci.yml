name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: 仕組みのテスト (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: テスト
        run: dotnet run --project tests/Hikidana.Core.Tests/Hikidana.Core.Tests.csproj -c Release

      # Windows の部分は Linux では動かせないので、ビルドできるかだけ確かめる
      - name: Windows の部分のビルド
        run: dotnet build tests/Hikidana.Win32.Tests/Hikidana.Win32.Tests.csproj -c Release

  app:
    name: アプリのビルド (Windows x64)
    runs-on: windows-latest
    permissions:
      contents: write # 画面写真を screenshots ブランチに置くため
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: テスト（仕組み）
        run: dotnet run --project tests/Hikidana.Core.Tests/Hikidana.Core.Tests.csproj -c Release

      - name: 発行
        run: dotnet publish src/Hikidana.App/Hikidana.App.csproj -c Release -r win-x64 -o publish/Hikidana-win-x64

      - name: 成果物を保存
        uses: actions/upload-artifact@v6
        with:
          name: Hikidana-win-x64
          path: publish/Hikidana-win-x64
          if-no-files-found: error

      # ランナーの画面は 1024x768 なので広げる
      # （Windows PowerShell 5.1 は UTF-8 の日本語を読み違えるので、日本語を書くステップは pwsh で動かす）
      - name: 画面の解像度を上げる
        shell: pwsh
        run: |
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class Display
          {
              [StructLayout(LayoutKind.Sequential, CharSet = CharSet.Unicode)]
              public struct DEVMODE
              {
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmDeviceName;
                  public short dmSpecVersion, dmDriverVersion, dmSize, dmDriverExtra;
                  public int dmFields, dmPositionX, dmPositionY, dmDisplayOrientation, dmDisplayFixedOutput;
                  public short dmColor, dmDuplex, dmYResolution, dmTTOption, dmCollate;
                  [MarshalAs(UnmanagedType.ByValTStr, SizeConst = 32)] public string dmFormName;
                  public short dmLogPixels;
                  public int dmBitsPerPel, dmPelsWidth, dmPelsHeight, dmDisplayFlags, dmDisplayFrequency;
                  public int dmICMMethod, dmICMIntent, dmMediaType, dmDitherType, dmReserved1, dmReserved2, dmPanningWidth, dmPanningHeight;
              }

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern bool EnumDisplaySettings(string deviceName, int modeNum, ref DEVMODE devMode);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int ChangeDisplaySettings(ref DEVMODE devMode, int flags);

              public static int Set(int width, int height)
              {
                  var mode = new DEVMODE();
                  mode.dmSize = (short)Marshal.SizeOf(typeof(DEVMODE));
                  if (!EnumDisplaySettings(null, -1, ref mode))
                      return -100;
                  mode.dmPelsWidth = width;
                  mode.dmPelsHeight = height;
                  mode.dmFields = 0x80000 | 0x100000;
                  return ChangeDisplaySettings(ref mode, 0);
              }
          }
          '@
          Write-Host "ChangeDisplaySettings: $([Display]::Set(1920, 1080))（0 なら成功）"
          Add-Type -AssemblyName System.Windows.Forms
          Write-Host "画面: $([System.Windows.Forms.Screen]::PrimaryScreen.Bounds)"

      # 本物のクリップボードとキー入力で、Edge のテストのページ（ChatGPT や Claude のアプリと同じ Chromium）と
      # メモ帳に貼り付ける。Edge の初回の案内は出さないようにする
      - name: テスト（Windows の部分、本当に貼り付ける）
        shell: pwsh
        env:
          HIKIDANA_SCREENSHOTS: ${{ github.workspace }}\screenshots
          HIKIDANA_EXE: ${{ github.workspace }}\publish\Hikidana-win-x64\Hikidana.exe
        run: |
          $policy = 'HKLM:\SOFTWARE\Policies\Microsoft\Edge'
          New-Item -Path $policy -Force | Out-Null
          foreach ($name in @('HideFirstRunExperience')) {
            New-ItemProperty -Path $policy -Name $name -Value 1 -PropertyType DWord -Force | Out-Null
          }
          foreach ($name in @('StartupBoostEnabled', 'BackgroundModeEnabled', 'DefaultBrowserSettingEnabled')) {
            New-ItemProperty -Path $policy -Name $name -Value 0 -PropertyType DWord -Force | Out-Null
          }
          dotnet run --project tests/Hikidana.Win32.Tests/Hikidana.Win32.Tests.csproj -c Release

      - name: アプリの記録（失敗したとき）
        if: failure()
        shell: pwsh
        run: Get-ChildItem (Join-Path $env:TEMP 'Hikidana-demo\logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }

      # 起動してすぐ落ちないかを確かめ、画面全体を撮る（見本の中身で、棚を開いた様子をいくつか）
      - name: 起動テストと画面写真
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'publish\Hikidana-win-x64\Hikidana.exe'
          New-Item -ItemType Directory -Force screenshots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $variants = @(
            @{ Name = 'light'; Args = '--demo --open --theme light' },
            @{ Name = 'dark'; Args = '--demo --open --theme dark' },
            @{ Name = 'left-dark'; Args = '--demo --open --theme dark --edge left' },
            @{ Name = 'top-light'; Args = '--demo --open --theme light --edge top --position 0.7' },
            @{ Name = 'closed-light'; Args = '--demo --theme light' },
            @{ Name = 'settings-light'; Args = '--demo --settings --theme light' },
            @{ Name = 'settings-dark'; Args = '--demo --settings --theme dark --edge left' },
            @{ Name = 'settings-behavior-light'; Args = '--demo --settings behavior --theme light' },
            @{ Name = 'settings-appearance-dark'; Args = '--demo --settings appearance --theme dark' },
            @{ Name = 'settings-records-light'; Args = '--demo --settings records --theme light' },
            @{ Name = 'settings-about-dark'; Args = '--demo --settings about --theme dark' },
            @{ Name = 'sizes-light'; Args = '--demo --open --theme light --text large --panel medium --handle-size large' },
            @{ Name = 'small-dark'; Args = '--demo --open --theme dark --text small --panel small --edge left --position 0.3' }
          )
          # マウスを棚から離しておく（カードの上にあると、マウスを乗せたときの見た目になる）
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(600, 700)
          foreach ($v in $variants) {
            $p = Start-Process -FilePath $exe -ArgumentList $v.Args -PassThru
            Start-Sleep -Seconds 8
            if ($p.HasExited) {
              Get-ChildItem (Join-Path $env:TEMP 'Hikidana-demo\logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }
              Write-Error "アプリが起動直後に終了しました（$($v.Name)、終了コード $($p.ExitCode)）"
            }
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
            $bmp.Save((Join-Path $PWD "screenshots\startup-$($v.Name).png"), [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose()
            $bmp.Dispose()
            Stop-Process -Id $p.Id -Force
            Start-Sleep -Seconds 2
          }
          Write-Host '見本の記録（ログ）:'
          Get-ChildItem (Join-Path $env:TEMP 'Hikidana-demo\logs') -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName }

      # Directory.Build.props の版が、まだ Releases に無ければ置く（アプリが新しい版に気づいて、ボタン 1 つで入れ替えられるように）。
      # 利用者に届けたい変更を出すときは、Directory.Build.props の Version を上げて push する。
      - name: 新しい版を Releases に置く
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-Xml -Path Directory.Build.props -XPath '//Version').Node.InnerText.Trim()
          $tag = "v$version"
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag は、もう Releases にあります"
            # 説明のファイルを直したときは、Releases の説明もそろえる（そろえられなくても止めない）
            $notes = "docs/releases/$version.md"
            if (Test-Path $notes) {
              gh release edit $tag --notes-file $notes
              if ($LASTEXITCODE -ne 0) {
                Write-Warning "Releases の説明をそろえられませんでした（$tag）"
              }
            }
            exit 0
          }
          $stage = Join-Path $env:RUNNER_TEMP 'release'
          New-Item -ItemType Directory -Force (Join-Path $stage 'Hikidana') | Out-Null
          Copy-Item publish\Hikidana-win-x64\* (Join-Path $stage 'Hikidana') -Recurse
          $name = "Hikidana-$version-win-x64.zip"
          $zip = Join-Path $env:RUNNER_TEMP $name
          Compress-Archive -Path (Join-Path $stage 'Hikidana') -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$hash  $name" -NoNewline -Encoding ascii
          $notes = "docs/releases/$version.md"
          if (-not (Test-Path $notes)) {
            $notes = 'docs/releases/default.md'
          }
          $extra = @()
          if ($version.Contains('-')) {
            $extra += '--prerelease'
          }
          gh release create $tag $zip "$zip.sha256" --title "Hikidana $version" --notes-file $notes --target $env:GITHUB_SHA @extra
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Releases に置けませんでした（$tag）"
            exit 1
          }
          Write-Host "Releases に置きました: $tag（$((Get-Item $zip).Length) バイト、SHA-256 $hash）"

      - name: 画面写真を保存
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore

      # main の最新の画面写真を screenshots ブランチに置く（毎回上書き）。GitHub 上でも見られる。
      - name: 画面写真を screenshots ブランチに置く
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if (-not (Test-Path screenshots)) {
            Write-Host '画面写真がありません'
            exit 0
          }
          $dir = Join-Path $env:RUNNER_TEMP 'screenshots-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item screenshots\* $dir
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          $lines = @('# 画面写真', '', "CI が自動で撮った、main の最新（$sha）の画面写真です。", '')
          foreach ($file in Get-ChildItem $dir -Filter *.png | Sort-Object Name) {
            $lines += "## $($file.BaseName)", '', "![$($file.BaseName)]($($file.Name))", ''
          }
          Set-Content -Path (Join-Path $dir 'README.md') -Encoding utf8 -Value $lines
          Set-Location $dir
          git init -q -b screenshots
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Screenshots for $sha"
          git push -q -f "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" screenshots
